# Browser: chrome | firefox
browser=chrome
# true = no visible window (required on CI). Use -Dheadless=false to watch it run.
headless=true

page.load.timeout.sec=30
explicit.wait.sec=10

# A page slower than this is marked FAIL
max.load.time.ms=8000

# Link checker
link.max.per.site=60
link.timeout.ms=8000
max.broken.percent=10

# Output (relative to project root). GitHub Pages serves the docs/ folder.
output.dir=docs

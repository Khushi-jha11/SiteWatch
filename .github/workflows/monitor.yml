name: SiteWatch monitor

on:
  schedule:
    # Runs every day at 06:00 UTC. Edit the cron expression to change the schedule.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # needed to commit the updated dashboard back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium/TestNG suite
        # Continues even if a site check fails, so the dashboard still gets built and published.
        run: mvn -B clean test
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "sitewatch-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update dashboard [skip ci]"
          git push
        continue-on-error: true

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: run-checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
